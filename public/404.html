<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Mahesh Pachapalam</title>
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b0c0f;
        color: #f2f2ef;
        font-family: 'Space Grotesk', Inter, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) { body { background: #f4f2ee; color: #0b0c0f; } }
      main { display: grid; gap: 1.25rem; padding: 2rem; max-width: 40rem; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
      h1 { margin: 0; font-size: clamp(3rem, 12vw, 8rem); line-height: 0.9; letter-spacing: -0.04em; }
      p { margin: 0; line-height: 1.6; opacity: 0.8; }
      a { color: #ff5a1f; text-decoration: none; border-bottom: 1px solid currentColor; }
      @media (prefers-color-scheme: light) { a { color: #d9430a; } }
    </style>
  </head>
  <body>
    <main>
      <span class="mono">404 — route not found</span>
      <h1>Lost the thread.</h1>
      <p>That page doesn't exist. Head back to the <a href="/" data-home>portfolio</a>.</p>
    </main>
    <script>
      // On *.github.io project sites the app lives under /<repo>/; on custom domains it lives at /.
      (function () {
        var seg = location.pathname.split('/').filter(Boolean);
        var base = /\.github\.io$/.test(location.hostname) && seg.length ? '/' + seg[0] + '/' : '/';
        document.querySelector('[data-home]').setAttribute('href', base);
      })();
    </script>
  </body>
</html>
